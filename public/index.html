<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — En construcción</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f1117;
      color: #e1e4eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #8b8fa3;
      font-size: 1.1rem;
      max-width: 400px;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #2a2d3a;
      background: #1a1c27;
      color: #22d3ee;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚀</div>
    <h1>Dashboard</h1>
    <p>El entorno está listo. Esperando el código de la aplicación.</p>
    <span class="badge">Docker + Nginx ✓</span>
  </div>
</body>
</html>
